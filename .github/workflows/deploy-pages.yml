name: Deploy Shadows Byte V2 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  # No cancelar una publicación en curso por cada cambio nuevo.
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Install image tooling
        run: python3 -m pip install "Pillow>=11,<13"
      - name: Generate PWA anime icons
        run: python3 tools/generate_pwa_icons.py
      - name: Save generated icons to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-icon-192.png app-icon-512.png anime-favicon.png
          if ! git diff --cached --quiet; then
            git commit -m "build(pwa): refresh anime PNG icons [skip ci]"
            git push || echo 'No se pudo guardar el PNG en Git; el icono generado se publicará en Pages igualmente.'
          fi
      - name: Stamp deployed PWA version
        env:
          SB_DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          sha = os.environ['SB_DEPLOY_SHA'].lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('Invalid deploy SHA')
          subjects = subprocess.check_output(
              ['git', 'log', '--no-merges', '-n', '25', '--pretty=format:%s'],
              text=True, encoding='utf-8', errors='replace'
          ).splitlines()
          changes = []
          for subject in subjects:
              subject = re.sub(r'\\s+', ' ', subject).strip()
              if not subject or subject.startswith('build(pwa):') or '[skip ci]' in subject:
                  continue
              if subject.startswith('chore('):
                  continue
              changes.append(subject[:140])
              if len(changes) == 5:
                  break
          payload = {'version': sha, 'published_at': datetime.now(timezone.utc).isoformat(), 'changes': changes}
          Path('app-version.json').write_text(json.dumps(payload, separators=(',', ':')) + '\n', encoding='utf-8')
          index_file = Path('index.html')
          html = index_file.read_text(encoding='utf-8')
          marker = '  <meta charset="UTF-8" />'
          if html.count(marker) != 1:
              raise SystemExit('Cannot stamp the index')
          html = html.replace(marker, marker + '\n  <meta name="sb-build" content="' + sha + '" />', 1)
          index_file.write_text(html, encoding='utf-8')
          worker_file = Path('sw.js')
          worker_file.write_text(worker_file.read_text(encoding='utf-8') + '\n// Deployed SB V2 build: ' + sha + '\n', encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
